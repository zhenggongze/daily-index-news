name: AI算力产业链每日资讯

on:
  # ⚠️ 注意：cron-job.org 是唯一调度源（每天 08:07 POST 到 workflow_dispatch API）
  # GitHub Actions schedule cron 因经常延迟数小时至十小时以上而废弃
  workflow_dispatch:
    inputs:
      skip_pipeline:
        description: '跳过数据流水线，仅重新构建部署（数据已有时使用）'
        type: boolean
        default: false
      force_refresh:
        description: '强制重新生成数据（覆盖今日已有数据）'
        type: boolean
        default: false

env:
  RUN_ID: ${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  daily-news:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 依赖
        run: |
          python workflow_logger.py --record "安装依赖" "running"
          pip install feedparser requests urllib3 oss2
          python workflow_logger.py --record "安装依赖" "success"

      - name: 幂等检查（今天OSS已有数据则跳过流水线）
        id: id_check
        if: ${{ ! inputs.skip_pipeline && ! inputs.force_refresh }}
        continue-on-error: true
        run: python check_oss_today.py
        env:
          OSS_AK_ID: ${{ secrets.OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.OSS_AK_SECRET }}

      - name: 运行数据流水线
        if: ${{ ! inputs.skip_pipeline && (inputs.force_refresh || steps.id_check.outcome != 'success') }}
        run: |
          python workflow_logger.py --record "运行数据流水线" "running"
          output=$(python daily_pipeline.py 2>&1)
          rc=$?
          echo "$output"
          if [ $rc -ne 0 ]; then
            err=$(echo "$output" | tail -5)
            python workflow_logger.py --record "运行数据流水线" "failure" "$err"
            exit $rc
          fi
          summary=$(echo "$output" | grep -E "(完成|✅|共.*条)" | tail -1)
          python workflow_logger.py --record "运行数据流水线" "success" "$summary"
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}
          FORCE_REFRESH: ${{ inputs.force_refresh == true && '1' || '' }}

      - name: 验证数据文件
        if: ${{ ! inputs.skip_pipeline }}
        run: |
          python workflow_logger.py --record "验证数据文件" "running"
          for f in news_site/public/data/*.json; do
            [ -f "$f" ] || continue
            count=$(python -c "import json; d=json.load(open('$f')); print(len(d.get('news',[])))" 2>/dev/null || echo "?")
            echo "  $(basename $f): $count 条"
          done
          python workflow_logger.py --record "验证数据文件" "success"

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Node 依赖
        run: |
          python ../workflow_logger.py --record "安装 Node 依赖" "running"
          npm ci
          python ../workflow_logger.py --record "安装 Node 依赖" "success"
        working-directory: news_site

      - name: 构建前端
        working-directory: news_site
        run: |
          python ../workflow_logger.py --record "构建前端" "running"
          npm run build
          rc=$?
          if [ $rc -ne 0 ]; then
            python ../workflow_logger.py --record "构建前端" "failure" "npm run build exit code $rc"
            exit $rc
          fi
          ls -lh dist/
          python ../workflow_logger.py --record "构建前端" "success"

      - name: 验证构建产物
        working-directory: news_site
        run: |
          python ../workflow_logger.py --record "验证构建产物" "running"
          python verify_deploy.py
          rc=$?
          if [ $rc -ne 0 ]; then
            python ../workflow_logger.py --record "验证构建产物" "failure" "verify_deploy.py failed"
            exit $rc
          fi
          python ../workflow_logger.py --record "验证构建产物" "success"

      - name: 部署到 OSS + 刷新 CDN
        working-directory: news_site
        run: |
          set +e
          python ../workflow_logger.py --record "部署到 OSS" "running"
          deploy_out=$(python deploy_minimal.py 2>&1)
          rc=$?
          echo "--- deploy output ---"
          echo "$deploy_out"
          echo "--- exit code: $rc ---"
          if [ $rc -ne 0 ]; then
            first_err=$(echo "$deploy_out" | grep "!!DEPLOY_FAIL!!" | head -1)
            python ../workflow_logger.py --record "部署到 OSS" "failure" "exit=$rc: $first_err"
            exit $rc
          fi
          python ../workflow_logger.py --record "部署到 OSS" "success"
        env:
          OSS_AK_ID: ${{ secrets.OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.OSS_AK_SECRET }}

      - name: 汇总报告并发送通知
        if: always()
        run: |
          # 2026-08-11 用户要求：不再 PushDeer 推送工作流报告（workflow_logger.py 检测不到 PUSHDEER_KEY 自动跳过）
          python workflow_logger.py --finish "${{ env.RUN_ID }}"
        env:
          OSS_AK_ID: ${{ secrets.OSS_AK_ID }}
          OSS_AK_SECRET: ${{ secrets.OSS_AK_SECRET }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
